services:
  zola:
    build:
      context: ../..
      dockerfile: deploy/vm/Dockerfile.zola
      args:
        MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lotediretor}
      POSTGRES_USER: ${POSTGRES_USER:-lotediretor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lotediretor} -d ${POSTGRES_DB:-lotediretor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      zola:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
  data:
