name: Import upstream ZoLa

on:
  push:
    paths:
      - ".github/workflows/import-zola.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lotediretor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official ZoLa upstream
        run: |
          git clone --depth 1 --branch develop https://github.com/NYCPlanning/labs-zola.git /tmp/labs-zola
          echo "UPSTREAM_SHA=$(git -C /tmp/labs-zola rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Replace repository contents with ZoLa baseline
        run: |
          rsync -a --delete --exclude='.git/' /tmp/labs-zola/ ./

      - name: Remove upstream embedded credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("config/environment.js")
          text = path.read_text()
          pattern = r"accessToken:\s*\n\s*'pk\.[^']+'"
          replacement = "accessToken: process.env.MAPBOX_ACCESS_TOKEN || ''"
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected Mapbox token was not found exactly once")
          path.write_text(updated)
          PY

      - name: Commit imported baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import official ZoLa baseline from NYCPlanning/labs-zola@${UPSTREAM_SHA}"
          git push origin HEAD:main
