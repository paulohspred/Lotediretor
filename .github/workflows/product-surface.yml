name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-contracts:
    name: Data contracts & source registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: pip install -r services/requirements.txt
      - name: Compile all Python
        run: python -m compileall -q services tools
      - name: Engine unit tests (offline)
        run: python -m unittest discover -s services/tests -v
      - name: Source registry schema
        run: python tools/discovery/validate_registry.py
      - name: Source registry references
        run: python tools/regression/check_source_registry.py
      - name: Report readiness is derived from the matrix
        run: python tools/discovery/build_report_readiness.py --check
      - name: Report spec
        run: python tools/discovery/validate_report_spec.py
      - name: Database schema contract
        run: python tools/discovery/validate_database_schema.py
      - name: Candidate queue
        run: python tools/discovery/validate_candidate_queue.py
      - name: Heritage resolver
        run: python tools/discovery/validate_heritage_resolver.py
      - name: Public event resolver
        run: python tools/discovery/validate_public_event_resolver.py
      - name: Utility resolver
        run: python tools/discovery/validate_utility_resolver.py

  database:
    name: Migrations apply on PostGIS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lotediretor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply migrations with the ledger runner (run twice = idempotent)
        env:
          LOTEDIRETOR_DB_DSN: postgresql://postgres:ci@localhost:5432/lotediretor
        run: |
          python3 tools/db/migrate.py
          python3 tools/db/migrate.py
          python3 tools/db/migrate.py --status
      - name: Install GDAL and engine dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gdal-bin
          pip install -r services/requirements.txt
      - name: Municipal factory tests (spec validation + harvest on PostGIS)
        env:
          LOTEDIRETOR_DB_DSN: postgresql://postgres:ci@localhost:5432/lotediretor
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/lotediretor
        run: |
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -f database/fixtures/ibge_municipios_sample.sql
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -v mesh_edition=fixture -v snapshot_id= -v min_count=4 -f database/loaders/promote_ibge_municipalities.sql
          python3 tools/loaders/load_source_registry.py
          python3 -m unittest discover -s tools/factory/tests -v
      - name: Legal engine tests (segmentation, extraction, validity, review)
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/lotediretor
        run: python3 -m unittest discover -s tools/legal/tests -v

  platform-api:
    name: Platform API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lotediretor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      LOTEDIRETOR_DB_DSN: postgresql://postgres:ci@localhost:5432/lotediretor
      # API tests run as the least-privilege runtime role so RLS and grants
      # are exercised exactly as in production.
      TEST_DATABASE_URL: postgresql://sentinelx:ci@localhost:5432/lotediretor
    defaults:
      run:
        working-directory: services/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL and engine dependencies
        working-directory: .
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gdal-bin
          pip install -r services/requirements.txt
      - name: Prepare database (migrations, sample mesh, registry, factory fixture)
        working-directory: .
        run: |
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -qc "CREATE ROLE sentinelx LOGIN PASSWORD 'ci'"
          python3 tools/db/migrate.py
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -f database/fixtures/ibge_municipios_sample.sql
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -v mesh_edition=fixture -v snapshot_id= -v min_count=4 -f database/loaders/promote_ibge_municipalities.sql
          python3 tools/loaders/load_source_registry.py
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -f database/fixtures/factory/load_fixture.sql
          python3 tools/factory/harvest.py --spec database/fixtures/factory/3159605.json
          python3 tools/legal/seed_catalog.py
          python3 tools/legal/ingest.py database/fixtures/legal/lc-1-2024-fixture.txt \
            --jurisdiction MUNICIPAL --ibge 3159605 --kind LEI_COMPLEMENTAR \
            --number 1/2024 --title "LC 1/2024 (fixture)" --valid-from 2024-01-01 \
            --zone-article ZR1=2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/platform-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  client-web:
    name: Client web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  legacy-static-client:
    name: Legacy static client (until migrated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("public/lotediretor/index.html").read_text(encoding="utf-8")
          start = s.index("<script>") + len("<script>")
          end = s.rindex("</script>")
          Path("/tmp/lotediretor-ui.js").write_text(s[start:end], encoding="utf-8")
          PY
          node --check /tmp/lotediretor-ui.js
      - name: Audit user-facing surface
        run: python tools/regression/audit_frontend.py

  e2e:
    name: E2E login flow (BFF + API + fake OIDC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lotediretor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      LOTEDIRETOR_DB_DSN: postgresql://postgres:ci@localhost:5432/lotediretor
      TEST_DATABASE_URL: postgresql://sentinelx:ci@localhost:5432/lotediretor
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare database
        run: |
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -qc "CREATE ROLE sentinelx LOGIN PASSWORD 'ci'"
          python3 tools/db/migrate.py
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -f database/fixtures/ibge_municipios_sample.sql
          psql "$LOTEDIRETOR_DB_DSN" -v ON_ERROR_STOP=1 -q -v mesh_edition=fixture -v snapshot_id= -v min_count=4 -f database/loaders/promote_ibge_municipalities.sql
      - name: Build platform API
        working-directory: services/platform-api
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build client web
        working-directory: apps/client-web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run E2E
        working-directory: apps/client-web
        run: npm run test:e2e
